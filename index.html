<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8aad78">
<title>xowonlink</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --bg:#8aad78; --box:#ffffff; --ink:#232823; --sub:rgba(255,255,255,.72);
  --line:#e2e6df; --edge:#c9cfc5; --mut:#9aa196; --card:#ffffff; --soft:#f1f4ef; --accent:#2f6f3a; --spoiler:#2b2f2b;
}
[data-theme="dark"]{
  --bg:#243225; --box:#1b211b; --ink:#e8ece6; --sub:rgba(255,255,255,.58);
  --line:#2f3a2f; --edge:#3a463a; --mut:#6d786c; --card:#1b211b; --soft:#252d25; --accent:#8fd09a; --spoiler:#556055;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Noto Sans KR',sans-serif;
  transition:background .25s;
}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:64px 18px 40px;text-align:center}

/* top bar */
.gear{
  position:fixed;top:14px;right:14px;width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:20;
}
.gear:active{transform:scale(.94)}
.status{
  position:fixed;top:20px;left:16px;font-size:12px;color:#fff;background:rgba(0,0,0,.25);
  padding:6px 12px;border-radius:999px;z-index:20;display:none;align-items:center;gap:6px;
}
.status.on{display:inline-flex}
.status.err{background:rgba(160,40,30,.75)}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* profile */
.avatar{
  width:104px;height:104px;border-radius:50%;margin:0 auto 14px;
  background:rgba(255,255,255,.3) center/cover no-repeat;position:relative;overflow:hidden;
}
.avatar.edit{cursor:pointer}
.avatar.empty{background:var(--soft);display:grid;place-items:center;color:var(--mut)}
.nick{margin:0;font-size:28px;font-weight:700;color:#fff;letter-spacing:-.02em}
.nick-sub{margin:6px 0 0;font-size:13px;color:var(--sub)}
.p-in{
  display:block;width:100%;max-width:300px;margin:4px auto 0;border:0;border-radius:0;
  background:transparent;color:#fff;text-align:center;font:inherit;padding:6px 10px;outline:none;
}
.p-in.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.p-in.small{font-size:13px;color:#fff}
.p-in::placeholder{color:rgba(255,255,255,.55)}

/* white box (square corners) */
.box{
  background:var(--box);border-radius:0;margin-top:22px;padding:20px;
  display:flex;flex-direction:column;gap:18px;text-align:center;
}
.t-text{font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.t-text a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.spoiler{background:var(--spoiler);color:transparent;border-radius:0;cursor:pointer;user-select:none;padding:0 2px}
.spoiler.revealed{background:var(--soft);color:inherit;user-select:auto}

.pimg{
  background:center/cover no-repeat var(--soft);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
}
.illust{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:0;cursor:zoom-in;text-decoration:none;-webkit-touch-callout:none}
.illust.link{cursor:pointer}
.illust .fill{position:absolute;inset:0}
.illust .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0) 55%);pointer-events:none}
.illust .cap{position:absolute;left:12px;bottom:10px;right:12px;color:#fff;font-size:14px;font-weight:600;text-align:left;pointer-events:none}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-cell{display:block;text-decoration:none;-webkit-touch-callout:none;min-width:0}
.g-cell .sq{aspect-ratio:1/1;border-radius:0}
.g-cell.link{cursor:pointer}
.g-title{font-size:12px;margin-top:5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* SNS buttons (rounded) */
.sns{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.sns.top{margin-top:26px;margin-bottom:0}
.bbtn{
  background:none;border-radius:18px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:10px;
  text-decoration:none;color:#fff;font-size:13px;font-weight:600;min-width:0;
}
a.bbtn:active{transform:scale(.97)}
.b-icon{width:76px;height:76px;border-radius:22px}
.b-label{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* editing UI */
.addbox{
  width:100%;height:56px;border:1.5px solid var(--edge);background:transparent;color:var(--mut);
  border-radius:0;display:grid;place-items:center;cursor:pointer
}
.eblock{border:1px solid var(--edge);border-radius:0;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:center;background:none}
.ehead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink)}
.ehead .lbl{opacity:.7}
.ehead .btns{display:flex;gap:2px}
.ib{background:none;border:0;padding:5px;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ib:active{opacity:.6}
.tools{display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap}
.tb{
  width:34px;height:34px;border:1px solid var(--edge);background:transparent;color:var(--ink);border-radius:9px;
  display:grid;place-items:center;font-size:15px;cursor:pointer;padding:0
}
.in{
  width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;
  padding:8px 10px;font:inherit;font-size:13px;outline:none;text-align:center;
}
.in:focus{border-color:var(--accent)}
.eblock .in{background:transparent;border:1px solid var(--edge);border-radius:0}
.eblock textarea.in{text-align:left;resize:vertical;min-height:96px;line-height:1.6;font-size:14px}
.preview{border-top:1px solid var(--edge);padding-top:10px;font-size:14px}
.pick{
  background:transparent;display:grid;place-items:center;color:var(--mut);cursor:pointer;
  border:1px solid var(--edge);border-radius:0;overflow:hidden;
}
.pick.r169{aspect-ratio:16/9}
.pick.r11{aspect-ratio:1/1}
.pick.ic{width:76px;height:76px;border-radius:22px;margin:0 auto;border:1.5px solid rgba(255,255,255,.7);color:rgba(255,255,255,.8)}
.g-edit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:none;display:flex;flex-direction:column;gap:4px;min-width:0}
.eblock .cell .in{border:0;background:transparent;font-size:12px;padding:5px 4px}
.cell .row{display:flex;gap:0;justify-content:center}
.addcell{border:1px solid var(--edge);background:transparent;color:var(--mut);border-radius:0;aspect-ratio:1/1;display:grid;place-items:center;cursor:pointer}
.bcard{border:1.5px solid rgba(255,255,255,.7);background:none;border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bcard .in{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:12px;padding:6px 8px}
.bcard .in::placeholder{color:rgba(255,255,255,.6)}
@media(max-width:480px){.g-edit{grid-template-columns:repeat(2,1fr)}.sns.editing{grid-template-columns:1fr}}

/* overlay / modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{
  width:100%;max-width:400px;max-height:88vh;overflow:auto;background:var(--box);color:var(--ink);
  border-radius:22px;padding:20px;text-align:left
}
.sheet.small{max-width:300px;text-align:center;display:flex;flex-direction:column;gap:8px}
.sheet h2{margin:0 0 14px;font-size:17px}
.sheet.small h2{margin:0 0 6px}
.opt{border:0;background:var(--soft);color:var(--ink);border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
.opt.danger{color:#c0392b}
.srow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.ctl{display:flex;align-items:center;gap:10px}
.sec{padding-top:14px;display:flex;flex-direction:column;gap:8px}
.sec .in{text-align:left}
.row2{display:flex;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;flex:1}
[data-theme="dark"] .btn{color:#10200f}
.btn.ghost{background:var(--soft);color:var(--ink)}
.msg{font-size:12px;min-height:16px;line-height:1.5}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#c3cbc0;border-radius:999px;transition:.2s;cursor:pointer}
.switch span::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(20px)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:3px;width:112px}
.seg button{background:none;border:0;position:relative;z-index:1;font-size:12px;font-weight:600;padding:5px 0;color:var(--ink);cursor:pointer}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--box);border-radius:999px;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg.r .thumb{transform:translateX(100%)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:60;display:grid;place-items:center;cursor:zoom-out}
.lb .pimg{width:96vw;height:92vh;background-size:contain;background-color:transparent}

/* footer */
.foot{margin-top:44px;font-size:12px;color:var(--sub);user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<button class="gear" id="gear" aria-label="설정">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<div class="status" id="status"></div>
<main class="wrap">
  <div id="app"></div>
  <footer class="foot">© xowon @xownox</footer>
</main>

<script>
/* ---------- 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().filter(k => k !== false && k != null).forEach(k => e.append(k.nodeType ? k : document.createTextNode(k)));
  return e;
}
const b64 = s => { const u = new TextEncoder().encode(s); let t = ''; u.forEach(x => t += String.fromCharCode(x)); return btoa(t); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
const blobB64 = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result.split(',')[1]); f.onerror = rej; f.readAsDataURL(blob); });
function normLink(u) {
  u = (u || '').trim();
  if (!u) return '';
  if (/^(javascript|data|vbscript):/i.test(u)) return '';
  if (/^(https?:|mailto:|\/|\.|#)/i.test(u)) return u;
  return 'https://' + u;
}

/* ---------- 아이콘 ---------- */
const IC = {
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  down: '<path d="M12 5v14M5 12l7 7 7-7"/>',
  left: '<path d="M19 12H5M12 5l-7 7 7 7"/>',
  right: '<path d="M5 12h14M12 5l7 7-7 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  spoiler: '<path d="M3 3l18 18"/><path d="M10.6 6.1A9.7 9.7 0 0 1 12 6c5 0 8.5 4 9.5 6a12 12 0 0 1-2.6 3.3M6.6 7.6A12 12 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
};
const ico = (n, sw = 2.4, sz = 18) => `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- 마크다운 ---------- */
function inline(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/__(.+?)__/g, '<u>$1</u>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/\|\|(.+?)\|{2,}/g, '<span class="spoiler" tabindex="0">$1</span>');
}
function md(src) {
  let s = esc(src);
  const hold = [];
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    u = normLink(u.replace(/&amp;/g, '&'));
    if (!u) return m;
    hold.push(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inline(t)}</a>`);
    return `\u0001${hold.length - 1}\u0001`;
  });
  s = inline(s).replace(/\u0001(\d+)\u0001/g, (m, i) => hold[i]);
  return s.replace(/\n/g, '<br>');
}

/* ---------- 상태 ---------- */
const defaults = () => ({
  siteTitle: '',
  showButtons: false,
  buttonsPos: 'bottom',
  profile: { icon: '', name: '', en: '' },
  blocks: [],
  buttons: [
    { icon: '', label: '갤러리', link: '' },
    { icon: '', label: '스핀스핀', link: '' },
    { icon: '', label: '준비 중', link: '' }
  ]
});
function merge(d) {
  const base = defaults();
  d = d || {};
  const btns = Array.isArray(d.buttons) ? d.buttons : [];
  return {
    siteTitle: typeof d.siteTitle === 'string' ? d.siteTitle : '',
    showButtons: !!d.showButtons,
    buttonsPos: d.buttonsPos === 'top' ? 'top' : 'bottom',
    profile: { ...base.profile, ...(d.profile || {}) },
    blocks: Array.isArray(d.blocks) ? d.blocks : base.blocks,
    buttons: [0, 1, 2].map(i => ({ ...base.buttons[i], ...(btns[i] || {}) }))
  };
}
function loadCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem('lk_cfg') || '{}'); } catch (e) {}
  const host = location.hostname;
  if (!c.owner && host.endsWith('.github.io')) {
    c.owner = host.split('.')[0];
    const seg = location.pathname.split('/')[1];
    c.repo = seg && !seg.includes('.') ? seg : `${c.owner}.github.io`;
  }
  c.branch = c.branch || 'main';
  c.path = c.path || 'data.json';
  return c;
}
let cfg = loadCfg();
let data = defaults();
let sha = null, dirty = false, saving = false, timer = null;
let editing = localStorage.getItem('lk_edit') === '1';
const token = () => localStorage.getItem('lk_token') || '';
const imgCache = new Map();
const pending = new Map();

/* ---------- 저장 상태 표시 ---------- */
let hideT = null;
function setStatus(kind, text) {
  const el = $('#status');
  clearTimeout(hideT);
  if (kind === 'saving') { el.innerHTML = '<span class="spin"></span>'; el.className = 'status on'; }
  else if (kind === 'saved') {
    el.textContent = '저장 완료!'; el.className = 'status on';
    hideT = setTimeout(() => el.classList.remove('on'), 2500);
  }
  else if (kind === 'error') { el.textContent = text || '저장 실패'; el.className = 'status on err'; }
  else el.className = 'status';
}

/* ---------- GitHub ---------- */
function gh(path, opt = {}) {
  const base = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}`;
  return fetch(path ? `${base}/${path}` : base, {
    cache: 'no-store',
    ...opt,
    headers: {
      Authorization: `Bearer ${token()}`,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opt.headers || {})
    }
  });
}
async function refreshSha() {
  const r = await gh(`contents/${cfg.path}?ref=${encodeURIComponent(cfg.branch)}`);
  if (r.ok) { sha = (await r.json()).sha; return true; }
  if (r.status === 404) { sha = null; return true; }
  return false;
}
async function load() {
  let ok = false;
  const draft = localStorage.getItem('lk_draft');
  if (token() && cfg.owner && cfg.repo) {
    try {
      const r = await gh(`contents/${cfg.path}?ref=${encodeURIComponent(cfg.branch)}`);
      if (r.ok) {
        const j = await r.json();
        sha = j.sha;
        data = merge(JSON.parse(unb64(j.content)));
        ok = true;
      } else if (r.status === 404) { sha = null; ok = true; }
    } catch (e) {}
    if (localStorage.getItem('lk_dirty') === '1' && draft) {
      try { data = merge(JSON.parse(draft)); dirty = true; ok = true; scheduleSave(300); } catch (e) {}
    }
  }
  if (!ok) {
    try {
      const r = await fetch(cfg.path + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { data = merge(await r.json()); ok = true; }
    } catch (e) {}
  }
  if (ok) { try { localStorage.setItem('lk_cache', JSON.stringify(data)); } catch (e) {} }
}
function scheduleSave(ms = 1200) { clearTimeout(timer); timer = setTimeout(save, ms); }
function touch() {
  dirty = true;
  try {
    localStorage.setItem('lk_draft', JSON.stringify(data));
    localStorage.setItem('lk_dirty', '1');
    localStorage.setItem('lk_cache', JSON.stringify(data));
  } catch (e) {}
  setStatus('saving');
  scheduleSave();
}
async function putFile(snapshot) {
  return gh(`contents/${cfg.path}`, {
    method: 'PUT',
    body: JSON.stringify({ message: 'update', content: b64(snapshot), branch: cfg.branch, ...(sha ? { sha } : {}) })
  });
}
async function save() {
  if (!token() || !dirty) return;
  if (saving) { scheduleSave(800); return; }
  saving = true; setStatus('saving');
  try {
    const snap = JSON.stringify(data, null, 2);
    let r = await putFile(snap);
    if (r.status === 409 || r.status === 422) { await refreshSha(); r = await putFile(snap); }
    if (!r.ok) throw new Error(r.status);
    sha = (await r.json()).content.sha;
    if (JSON.stringify(data, null, 2) === snap) {
      dirty = false; localStorage.removeItem('lk_dirty'); setStatus('saved');
    } else scheduleSave(300);
  } catch (e) { setStatus('error'); scheduleSave(5000); }
  finally { saving = false; }
}
window.addEventListener('beforeunload', e => { if (dirty && token()) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) save(); });

/* ---------- 이미지 ---------- */
const isAbs = p => /^(https?:|data:|blob:)/.test(p);
async function fetchBlob(p) {
  if (pending.has(p)) return pending.get(p);
  const pr = (async () => {
    const r = await gh(`contents/${p}?ref=${encodeURIComponent(cfg.branch)}`, { headers: { Accept: 'application/vnd.github.raw+json' } });
    if (!r.ok) throw new Error('img');
    const u = URL.createObjectURL(await r.blob());
    imgCache.set(p, u);
    return u;
  })();
  pending.set(p, pr);
  pr.finally(() => pending.delete(p));
  return pr;
}
function applyImg(el, p) {
  if (!p) { el.style.backgroundImage = ''; return; }
  el.dataset.src = p;
  const u = isAbs(p) ? p : (imgCache.get(p) || p);
  el.style.backgroundImage = `url("${u}")`;
  if (token() && !isAbs(p) && !imgCache.has(p) && cfg.owner) {
    fetchBlob(p).then(b => { if (el.dataset.src === p) el.style.backgroundImage = `url("${b}")`; }).catch(() => {});
  }
}
async function downscale(file, max) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/png'));
  } catch (e) { return file; }
}
async function uploadImage(file, max) {
  const blob = max ? await downscale(file, max) : file;
  let ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
  const path = `images/${Date.now()}-${uid()}.${ext}`;
  setStatus('saving');
  const r = await gh(`contents/${path}`, {
    method: 'PUT',
    body: JSON.stringify({ message: 'upload image', content: await blobB64(blob), branch: cfg.branch })
  });
  if (!r.ok) throw new Error('upload');
  imgCache.set(path, URL.createObjectURL(blob));
  return path;
}
function pick(cb, max) {
  const i = h('input', { type: 'file', accept: 'image/*' });
  i.onchange = async () => {
    const f = i.files[0];
    if (!f) return;
    try { const p = await uploadImage(f, max); cb(p); touch(); render(); }
    catch (e) { setStatus('error', '업로드 실패'); }
  };
  i.click();
}
function choose(title, items) {
  $('.ov')?.remove();
  const ov = h('div', { class: 'ov', onclick: e => { if (e.target === ov) ov.remove(); } });
  ov.append(h('div', { class: 'sheet small' },
    title ? h('h2', {}, title) : null,
    items.map(it => h('button', { class: 'opt' + (it.danger ? ' danger' : ''), onclick: () => { ov.remove(); it.fn(); } }, it.label))));
  document.body.append(ov);
}
function imgMenu(cb, max) {
  choose('', [
    { label: '이미지 수정', fn: () => pick(cb, max) },
    { label: '이미지 삭제', danger: true, fn: () => { cb(''); touch(); render(); } }
  ]);
}
function picker(path, cls, cb, max) {
  const el = h('div', { class: 'pick ' + cls, onclick: () => path ? imgMenu(cb, max) : pick(cb, max) });
  if (path) {
    const f = h('div', { class: 'pimg', style: 'width:100%;height:100%' });
    applyImg(f, path);
    el.append(f);
  } else el.append(h('span', { html: ico('plus', 2, 28) }));
  return el;
}

/* ---------- 렌더링 ---------- */
function render() {
  const y = window.scrollY;
  const app = $('#app');
  app.innerHTML = '';
  app.append(renderProfile());
  if (data.showButtons && data.buttonsPos === 'top') app.append(renderButtons());
  app.append(renderBox());
  if (data.showButtons && data.buttonsPos !== 'top') app.append(renderButtons());
  document.title = data.siteTitle || 'xowonlink';
  window.scrollTo(0, y);
}
function bind(inp, obj, key, after) {
  inp.value = obj[key] || '';
  inp.addEventListener('input', () => { obj[key] = inp.value; if (after) after(); touch(); });
  return inp;
}
function renderProfile() {
  const p = data.profile;
  const wrap = h('div');
  if (!editing) {
    if (p.icon) {
      const av = h('div', { class: 'avatar pimg' });
      applyImg(av, p.icon);
      wrap.append(av);
    }
    if (p.name) wrap.append(h('h1', { class: 'nick' }, p.name));
    if (p.en) wrap.append(h('p', { class: 'nick-sub' }, p.en));
  } else {
    const setIcon = v => p.icon = v;
    const av = h('div', {
      class: 'avatar edit pimg' + (p.icon ? '' : ' empty'),
      onclick: () => p.icon ? imgMenu(setIcon, 512) : pick(setIcon, 512)
    });
    if (p.icon) applyImg(av, p.icon); else av.innerHTML = ico('plus', 2, 36);
    wrap.append(
      av,
      bind(h('input', { class: 'p-in big', placeholder: '닉네임' }), p, 'name'),
      bind(h('input', { class: 'p-in small', placeholder: '@nickname' }), p, 'en')
    );
  }
  return wrap;
}
function renderBox() {
  const box = h('section', { class: 'box' });
  data.blocks.forEach((b, i) => {
    const el = editing ? editBlock(b, i) : viewBlock(b);
    if (el) box.append(el);
  });
  if (editing) {
    const add = (type, extra) => () => { data.blocks.push({ id: uid(), type, ...extra }); touch(); render(); };
    box.append(h('button', {
      class: 'addbox', 'aria-label': '콘텐츠 추가', html: ico('plus', 2, 26),
      onclick: () => choose('콘텐츠 추가', [
        { label: '텍스트', fn: add('text', { text: '' }) },
        { label: '일러스트', fn: add('illust', { image: '', title: '', link: '' }) },
        { label: '갤러리', fn: add('gallery', { items: [] }) }
      ])
    }));
  } else if (!box.children.length) box.style.display = 'none';
  return box;
}
function viewBlock(b) {
  if (b.type === 'text') return (b.text || '').trim() ? h('div', { class: 't-text', html: md(b.text) }) : null;
  if (b.type === 'illust') {
    if (!b.image) return null;
    const link = normLink(b.link);
    const el = h(link ? 'a' : 'div', { class: 'illust' + (link ? ' link' : ''), draggable: 'false', ...(link ? { href: link, target: '_blank', rel: 'noopener noreferrer' } : {}) });
    const im = h('div', { class: 'pimg fill' });
    applyImg(im, b.image);
    el.append(im, h('div', { class: 'shade' }), b.title && h('div', { class: 'cap' }, b.title));
    if (!link) el.onclick = () => openLightbox(b.image);
    return el;
  }
  if (b.type === 'gallery') {
    const items = (b.items || []).filter(x => x.image);
    if (!items.length) return null;
    const g = h('div', { class: 'gallery' });
    items.forEach(it => {
      const link = normLink(it.link);
      const c = h(link ? 'a' : 'div', { class: 'g-cell' + (link ? ' link' : ''), draggable: 'false', ...(link ? { href: link, target: '_blank', rel: 'noopener noreferrer' } : {}) });
      const im = h('div', { class: 'pimg sq' });
      applyImg(im, it.image);
      c.append(im, it.title && h('div', { class: 'g-title' }, it.title));
      g.append(c);
    });
    return g;
  }
  return null;
}
function wrapSel(ta, l, r = '', ph = '텍스트') {
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.setRangeText(l + (ta.value.slice(s, e) || ph) + r, s, e, 'select');
  ta.dispatchEvent(new Event('input'));
  ta.focus();
}
function move(arr, i, d) {
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  touch(); render();
}
const ib = (name, label, fn, sz = 18) => h('button', { class: 'ib', type: 'button', 'aria-label': label, html: ico(name, 3, sz), onclick: fn });
function editBlock(b, i) {
  const names = { text: '텍스트 상자', illust: '일러스트 상자', gallery: '갤러리 상자' };
  const head = h('div', { class: 'ehead' }, h('span', { class: 'lbl' }, names[b.type]),
    h('div', { class: 'btns' },
      ib('up', '위로', () => move(data.blocks, i, -1)),
      ib('down', '아래로', () => move(data.blocks, i, 1)),
      ib('x', '삭제', () => { if (confirm('이 상자를 삭제할까요?')) { data.blocks.splice(i, 1); touch(); render(); } })));
  const wrap = h('div', { class: 'eblock' }, head);
  if (b.type === 'text') {
    const ta = h('textarea', { class: 'in', placeholder: '내용을 입력하세요' });
    const prev = h('div', { class: 'preview t-text' });
    bind(ta, b, 'text', () => prev.innerHTML = md(b.text));
    prev.innerHTML = md(b.text || '');
    const tool = (html, label, l, r, ph) => h('button', { class: 'tb', type: 'button', 'aria-label': label, html, onclick: () => wrapSel(ta, l, r, ph) });
    wrap.append(
      h('div', { class: 'tools' },
        tool('<b>B</b>', '굵게', '**', '**'),
        tool('<i>I</i>', '기울임', '*', '*'),
        tool('<u>U</u>', '밑줄', '__', '__'),
        tool('<s>S</s>', '취소선', '~~', '~~'),
        tool(ico('link', 2.2, 16), '링크', '[', '](https://)'),
        tool(ico('spoiler', 2.2, 16), '스포일러', '||', '||', '가릴 문구')),
      ta, prev);
  } else if (b.type === 'illust') {
    wrap.append(
      picker(b.image, 'r169', v => b.image = v),
      bind(h('input', { class: 'in', placeholder: '제목' }), b, 'title'),
      bind(h('input', { class: 'in', placeholder: '링크' }), b, 'link')
    );
  } else if (b.type === 'gallery') {
    b.items = b.items || [];
    const g = h('div', { class: 'g-edit' });
    b.items.forEach((it, k) => {
      g.append(h('div', { class: 'cell' },
        picker(it.image, 'r11', v => it.image = v),
        bind(h('input', { class: 'in', placeholder: '제목' }), it, 'title'),
        bind(h('input', { class: 'in', placeholder: '링크' }), it, 'link'),
        h('div', { class: 'row' },
          ib('left', '앞으로', () => move(b.items, k, -1), 16),
          ib('right', '뒤로', () => move(b.items, k, 1), 16),
          ib('x', '삭제', () => { b.items.splice(k, 1); touch(); render(); }, 16))));
    });
    g.append(h('button', { class: 'addcell', 'aria-label': '추가', html: ico('plus', 2, 26), onclick: () => { b.items.push({ image: '', title: '', link: '' }); touch(); render(); } }));
    wrap.append(g);
  }
  return wrap;
}
function renderButtons() {
  const g = h('div', { class: 'sns' + (data.buttonsPos === 'top' ? ' top' : '') + (editing ? ' editing' : '') });
  data.buttons.forEach(btn => {
    if (!editing) {
      if (!btn.icon && !btn.label) return;
      const link = normLink(btn.link);
      const el = h(link ? 'a' : 'div', { class: 'bbtn', draggable: 'false', ...(link ? { href: link, target: '_blank', rel: 'noopener noreferrer' } : {}) });
      if (btn.icon) { const ic = h('div', { class: 'pimg b-icon' }); applyImg(ic, btn.icon); el.append(ic); }
      if (btn.label) el.append(h('div', { class: 'b-label' }, btn.label));
      g.append(el);
    } else {
      g.append(h('div', { class: 'bcard' },
        picker(btn.icon, 'ic', v => btn.icon = v, 256),
        bind(h('input', { class: 'in', placeholder: '글' }), btn, 'label'),
        bind(h('input', { class: 'in', placeholder: '링크' }), btn, 'link')));
    }
  });
  return g;
}

/* ---------- 라이트박스 ---------- */
function openLightbox(p) {
  const im = h('div', { class: 'pimg' });
  applyImg(im, p);
  const lb = h('div', { class: 'lb', onclick: () => lb.remove() }, im);
  document.body.append(lb);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('.lb')?.remove(); $('.ov')?.remove(); } });

/* ---------- 이미지 보호 / 스포일러 ---------- */
document.addEventListener('contextmenu', e => { if (e.target.closest('.pimg,.illust,.g-cell,.lb,.avatar,.b-icon,.bbtn')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (!e.target.closest('textarea,input')) e.preventDefault(); });
document.addEventListener('click', e => { const s = e.target.closest('.spoiler'); if (s) s.classList.toggle('revealed'); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList?.contains('spoiler')) e.target.classList.toggle('revealed'); });

/* ---------- 테마 ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('lk_theme', t);
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#243225' : '#8aad78';
}
setTheme(localStorage.getItem('lk_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

/* ---------- 설정 ---------- */
function urlRepo() {
  const host = location.hostname;
  if (!host.endsWith('.github.io')) return null;
  const owner = host.split('.')[0];
  const seg = location.pathname.split('/')[1];
  return { owner, repo: seg && !seg.includes('.') ? seg : `${owner}.github.io` };
}
function openSettings() {
  $('.ov')?.remove();
  const has = !!token();
  const ov = h('div', { class: 'ov', onclick: e => { if (e.target === ov) ov.remove(); } });
  const sw = (checked, fn) => {
    const i = h('input', { type: 'checkbox' });
    i.checked = checked;
    i.onchange = () => fn(i.checked);
    return h('label', { class: 'switch' }, i, h('span'));
  };
  const tokIn = h('input', { class: 'in', type: 'password', placeholder: has ? '저장된 토큰이 있어요 (변경 시 입력)' : 'GitHub 토큰', autocomplete: 'off' });
  const msg = h('div', { class: 'msg' });
  const errText = (code, t) => ({
    auth: '토큰이 올바르지 않거나 만료되었어요.',
    repo: `${t ? t.owner + '/' + t.repo : '저장소'} 저장소를 찾지 못했어요. 토큰에 이 저장소의 Contents 읽기/쓰기 권한이 있는지 확인해 주세요.`,
    perm: '쓰기 권한이 없어요. Contents 권한을 읽기/쓰기로 바꿔 주세요.',
    where: '이 페이지가 깃허브 페이지 주소(아이디.github.io)에서 열려 있어야 연결할 수 있어요.',
    net: '연결 중 오류가 났어요. 잠시 후 다시 시도해 주세요.'
  }[code] || '연결하지 못했어요.');
  const saveBtn = h('button', { class: 'btn', onclick: async () => {
    const tok = tokIn.value.trim();
    if (!tok) { msg.textContent = '토큰을 입력해 주세요.'; return; }
    const prevTok = token(), prevCfg = { ...cfg };
    localStorage.setItem('lk_token', tok);
    msg.textContent = '확인 중...';
    let target = null;
    try {
      target = urlRepo();
      if (!target) {
        const ur = await fetch('https://api.github.com/user', { cache: 'no-store', headers: { Authorization: `Bearer ${tok}`, Accept: 'application/vnd.github+json' } });
        if (ur.status === 401) throw 'auth';
        if (!ur.ok) throw 'net';
        const login = (await ur.json()).login;
        target = { owner: login, repo: `${login}.github.io` };
      }
      cfg = { ...cfg, ...target };
      const res = await gh('');
      if (res.status === 401) throw 'auth';
      if (res.status === 404 || res.status === 403) throw (urlRepo() ? 'repo' : 'where');
      if (!res.ok) throw 'net';
      const info = await res.json();
      if (info.permissions && info.permissions.push === false) throw 'perm';
      cfg.branch = info.default_branch || 'main';
      localStorage.setItem('lk_cfg', JSON.stringify(cfg));
      await load();
      render();
      openSettings();
      $('.msg').textContent = '연결되었어요. 편집 모드를 켤 수 있어요.';
    } catch (e) {
      if (prevTok) localStorage.setItem('lk_token', prevTok); else localStorage.removeItem('lk_token');
      cfg = prevCfg;
      msg.textContent = errText(typeof e === 'string' ? e : 'net', target);
    }
  } }, '연결');
  const sec = h('div', { class: 'sec' },
    h('strong', {}, '토큰 설정'),
    tokIn,
    h('div', { class: 'row2' }, saveBtn,
      has && h('button', { class: 'btn ghost', onclick: () => {
        localStorage.removeItem('lk_token'); editing = false; localStorage.setItem('lk_edit', '0');
        render(); ov.remove();
      } }, '토큰 삭제')),
    msg);
  const titleIn = h('input', { class: 'in', placeholder: 'xowonlink', style: 'max-width:200px;text-align:right' });
  titleIn.value = data.siteTitle || '';
  titleIn.addEventListener('input', () => { data.siteTitle = titleIn.value; document.title = data.siteTitle || 'xowonlink'; touch(); });
  const seg = h('div', { class: 'seg' + (data.buttonsPos === 'bottom' ? ' r' : '') },
    h('span', { class: 'thumb' }),
    h('button', { type: 'button', onclick: () => setPos('top') }, '상단'),
    h('button', { type: 'button', onclick: () => setPos('bottom') }, '하단'));
  function setPos(p) { data.buttonsPos = p; seg.classList.toggle('r', p === 'bottom'); touch(); render(); }
  const sheet = h('div', { class: 'sheet' },
    h('h2', {}, '설정'),
    h('div', { class: 'srow' }, h('span', {}, '다크 모드'), sw(document.documentElement.dataset.theme === 'dark', v => setTheme(v ? 'dark' : 'light'))),
    has && h('div', { class: 'srow' }, h('span', {}, '편집 모드'), sw(editing, v => { editing = v; localStorage.setItem('lk_edit', v ? '1' : '0'); render(); })),
    has && h('div', { class: 'srow' }, h('span', {}, '사이트명'), titleIn),
    has && h('div', { class: 'srow' }, h('span', {}, 'SNS 버튼'),
      h('div', { class: 'ctl' }, seg, sw(data.showButtons, v => { data.showButtons = v; touch(); render(); }))),
    sec);
  ov.append(sheet);
  document.body.append(ov);
}
$('#gear').onclick = openSettings;

/* ---------- 시작 ---------- */
(async function init() {
  try { const c = localStorage.getItem('lk_cache'); if (c) data = merge(JSON.parse(c)); } catch (e) {}
  if (!token()) editing = false;
  render();
  await load();
  render();
  if (dirty) save();
})();
</script>
</body>
</html>
